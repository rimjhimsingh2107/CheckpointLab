name: CI

# Both tiers run. The repo is public, so Actions minutes are unmetered and
# there's no reason to skip the tests that actually exercise the product --
# the slow tier is the only thing that spawns real DDP subprocesses, kills
# them, and checks the recovery. Skipping it would leave CI validating the
# arithmetic while the crash-recovery loop went untested.
#
# They're separate jobs rather than one, so a syntax error or a broken
# estimator reports in ~2 minutes instead of waiting behind 20 minutes of
# subprocess training. The jobs run in parallel.

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; no point burning a runner on a commit
# that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast tests (unit + estimators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The default Linux torch wheel bundles CUDA and is ~2.5 GB. This
          # project is CPU-only by design (gloo backend), so the CPU wheel is
          # both correct and roughly an order of magnitude smaller.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Environment
        run: |
          python -c "import sys, torch, torchvision; print(f'python {sys.version}'); print(f'torch {torch.__version__}  torchvision {torchvision.__version__}  cuda={torch.cuda.is_available()}')"
          echo "cores: $(nproc)"

      - name: Fast tests
        run: pytest -m "not slow" -q

  slow:
    name: slow tests (real DDP crash + recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # CIFAR-10 is ~170 MB from cs.toronto.edu, which rate-limits. Caching it
      # keeps CI off that dependency; the dataset never changes, so the key is
      # static and only the first run pays for it.
      - name: Cache CIFAR-10
        uses: actions/cache@v4
        with:
          path: data
          key: cifar10-python-v1

      # Done as its own step so a download failure is diagnosable here rather
      # than surfacing as an opaque timeout inside a training subprocess.
      - name: Ensure CIFAR-10 present
        run: |
          python -c "from torchvision import datasets; datasets.CIFAR10(root='./data', train=True, download=True); print('dataset ready')"

      - name: Environment
        run: |
          python -c "import torch; print(f'torch {torch.__version__} cuda={torch.cuda.is_available()}')"
          echo "cores: $(nproc)"

      # -x: the slow tests are expensive, and once one fails the others are
      # very likely failing for the same reason. Fail fast and keep the log
      # readable. --durations surfaces which of the three is the long pole.
      - name: Slow tests
        run: pytest -m slow -q -x --durations=5

      # Any failure leaves the evidence on disk; without this the logs are all
      # you get, and the loss/failure/recovery JSONL is what actually explains
      # a divergence.
      - name: Upload run artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-evidence
          path: |
            results/verify/**/*.jsonl
            results/verify/summary.json
            results/repro/**/*.jsonl
            results/repro/summary.json
          if-no-files-found: ignore
          retention-days: 7
