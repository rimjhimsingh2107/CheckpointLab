# CheckpointLab compose stack.
#
# Three profiles, because "run it in Docker" means different things for the
# three things this project does:
#
#   --profile train    two containers, one per DDP rank, doing real
#                      distributed training across a container network.
#                      This is the Phase 1 baseline, containerized.
#
#   --profile recover  one container running the Phase 4 controller, which
#                      supervises its worker ranks as processes INSIDE that
#                      container. See the note on supervision below -- this
#                      is deliberately not the same shape as `train`.
#
#   --profile test     the test suite, inside the image.
#
#   --profile monitor  exporter + Prometheus + Grafana. Long-lived;
#                      bring it up first, then run a train/recover
#                      profile alongside it to generate activity.
#
# WHY `recover` IS ONE CONTAINER AND `train` IS TWO
#
# controller/worker_manager.py supervises ranks with subprocess.Popen and
# os.killpg: it polls process liveness and signals process groups. Those are
# operations on local PIDs, so a controller in container A cannot see, poll or
# kill a rank in container B. Making cross-container supervision work needs
# worker_manager to grow a container backend (talk to the Docker socket,
# `create`/`start`/`kill`/`wait` instead of Popen/killpg) plus a health model
# that doesn't assume shared PID namespace. That is a real feature, not a
# compose-file detail, so it is not claimed here.
#
# What `recover` therefore verifies is narrower but still worth having: that
# the whole crash-detect-restore-resume loop works correctly inside a
# container -- same gloo rendezvous, same filesystem semantics for atomic
# checkpoint writes, same signal handling.

name: checkpointlab

x-worker: &worker
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: checkpointlab:local
  volumes:
    # Bind-mounted rather than named volumes so checkpoints, loss logs and
    # recovery logs are inspectable from the host after a run -- the JSONL is
    # the evidence every earlier phase relies on.
    - ../results:/app/results
    # Read-only: CIFAR-10 is an input. Mounting it rw invites a container to
    # re-download over a good copy.
    - ../data:/app/data:ro
  environment:
    # rank 0 hosts the gloo TCPStore, so every rank rendezvouses on its
    # service name. On bare metal this defaults to localhost; across
    # containers it has to be resolvable DNS, which compose provides.
    MASTER_ADDR: worker0
    PYTHONUNBUFFERED: "1"
  networks: [ckpt]

services:

  # ---------------------------------------------------------------- train
  worker0:
    <<: *worker
    profiles: [train]
    container_name: ckpt-worker0
    command:
      - python
      - training/train.py
      - --rank=0
      - --world-size=2
      - --master-port=29500
      # TRAIN_RUN lets verify_docker.sh run this profile twice to separate
      # dirs, which is how in-container determinism gets proven.
      - --job-dir=/app/results/${TRAIN_RUN:-docker-train}
      - --deterministic
      - --batch-size=32
      - --subset-size=1024
      - --epochs=2
      - --max-steps=12
      - --checkpoint-every=4
      - --log-every=1
      - --no-resume

  worker1:
    <<: *worker
    profiles: [train]
    container_name: ckpt-worker1
    # Ordering only, not readiness -- rank 1 retries the rendezvous, so a
    # slow rank 0 is survivable. depends_on just avoids the noisy first
    # connection refusal in the logs.
    depends_on: [worker0]
    command:
      - python
      - training/train.py
      - --rank=1
      - --world-size=2
      - --master-port=29500
      # TRAIN_RUN lets verify_docker.sh run this profile twice to separate
      # dirs, which is how in-container determinism gets proven.
      - --job-dir=/app/results/${TRAIN_RUN:-docker-train}
      - --deterministic
      - --batch-size=32
      - --subset-size=1024
      - --epochs=2
      - --max-steps=12
      - --checkpoint-every=4
      - --log-every=1
      - --no-resume

  # -------------------------------------------------------------- recover
  controller:
    <<: *worker
    profiles: [recover]
    container_name: ckpt-controller
    environment:
      MASTER_ADDR: localhost   # ranks are siblings in this container
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - controller/recovery.py
      - --job-dir=/app/results/docker-recover
      - --world-size=2
      - --epochs=4
      - --batch-size=32
      - --subset-size=1024
      - --max-steps=14
      - --checkpoint-every=3
      - --failure-rate=0.05
      - --failure-seed=23      # same seed as demo/demo.sh: one failure, step 7, worker 1
      - --log-every=1000

  # ----------------------------------------------------------------- test
  tests:
    <<: *worker
    profiles: [test]
    container_name: ckpt-tests
    environment:
      MASTER_ADDR: localhost
      PYTHONUNBUFFERED: "1"
    command: ["pytest", "-m", "not slow", "-q"]

  # -------------------------------------------------------------- monitor
  #
  # WHY THE EXPORTER IS A SEPARATE LONG-LIVED SERVICE
  #
  # The workers are killed on purpose and repeatedly. A scrape target has to
  # be present when Prometheus arrives, so it cannot live inside a process
  # that is designed to die -- an in-process exporter would produce a
  # sawtooth of target-down gaps and counters resetting to zero on every
  # restart. This reads the durable JSONL instead, so the metrics outlive the
  # workers that produced them.
  exporter:
    <<: *worker
    profiles: [monitor]
    container_name: ckpt-exporter
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Read-only: the exporter observes, it never writes. The training
      # containers mount the same path rw.
      - ../results:/app/results:ro
    ports:
      - "9101:9101"
    command:
      - python
      - -m
      - metrics.prometheus
      - --results-root=/app/results
      - --port=9101

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: [monitor]
    container_name: ckpt-prometheus
    depends_on: [exporter]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # These jobs last ~30-60s, so the useful retention is minutes. Keeping
      # it small means `down -v` is genuinely cheap to redo.
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    networks: [ckpt]

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [monitor]
    container_name: ckpt-grafana
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin: this is a local demo stack on a bridge network with
      # no data worth protecting, and a login wall between a reader and the
      # dashboard is the main reason nobody looks at it. Do NOT copy this to
      # anything reachable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "light"
      # Land straight on the dashboard instead of the Grafana welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/checkpointlab.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [ckpt]

networks:
  ckpt:
    driver: bridge
